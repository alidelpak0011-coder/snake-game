<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>بازی مار تفننی</title>
    <style>
        body { background: #1a1a1a; color: white; text-align: center; font-family: sans-serif; margin: 0; padding: 0; overflow: hidden; }
        canvas { background: #111; display: block; margin: 10px auto; border: 4px solid #333; max-width: 90vw; max-height: 50vh; }
        .controls { display: grid; grid-template-columns: repeat(3, 70px); grid-gap: 10px; justify-content: center; margin-top: 15px; }
        button { width: 70px; height: 70px; background: #444; border: none; color: white; font-size: 24px; border-radius: 10px; }
        button:active { background: #666; }
        .up { grid-column: 2; } .left { grid-column: 1; } .right { grid-column: 3; } .down { grid-column: 2; }
    </style>
</head>
<body>
    <h3>امتیاز: <span id="score">0</span></h3>
    <canvas id="gameCanvas" width="400" height="400"></canvas>
    <div class="controls">
        <button class="up" onclick="changeDir('UP')">⬆️</button>
        <button class="left" onclick="changeDir('LEFT')">⬅️</button>
        <button class="right" onclick="changeDir('RIGHT')">➡️</button>
        <button class="down" onclick="changeDir('DOWN')">⬇️</button>
    </div>
    <script>
        const canvas = document.getElementById("gameCanvas"); const ctx = canvas.getContext("2d");
        const box = 20; let snake = [{x: 200, y: 200}]; let food = {x: Math.floor(Math.random()*20)*box, y: Math.floor(Math.random()*20)*box};
        let d = "RIGHT"; let score = 0;
        function changeDir(dir) { if(dir==="LEFT" && d!=="RIGHT") d="LEFT"; if(dir==="UP" && d!=="DOWN") d="UP"; if(dir==="RIGHT" && d!=="LEFT") d="RIGHT"; if(dir==="DOWN" && d!=="UP") d="DOWN"; }
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for(let i=0; i<snake.length; i++) { ctx.fillStyle = i===0 ? "#4CAF50" : "#81C784"; ctx.fillRect(snake[i].x, snake[i].y, box, box); }
            ctx.fillStyle = "#FF5722"; ctx.fillRect(food.x, food.y, box, box);
            let snakeX = snake.x; let snakeY = snake.y;
            if(d === "LEFT") snakeX -= box; if(d === "UP") snakeY -= box; if(d === "RIGHT") snakeX += box; if(d === "DOWN") snakeY += box;
            if(snakeX === food.x && snakeY === food.y) { score++; document.getElementById("score").innerText = score; food = {x: Math.floor(Math.random()*20)*box, y: Math.floor(Math.random()*20)*box}; } else { snake.pop(); }
            let newHead = {x: snakeX, y: snakeY};
            if(snakeX < 0 || snakeX >= canvas.width || snakeY < 0 || snakeY >= canvas.height || collision(newHead, snake)) { clearInterval(game); alert("بازی تمام شد! امتیاز شما: " + score); location.reload(); return; }
            snake.unshift(newHead);
        }
        function collision(head, array) { for(let i=0; i<array.length; i++) { if(head.x === array[i].x && head.y === array[i].y) return true; } return false; }
        let game = setInterval(draw, 150);
    </script>
</body>
</html>
